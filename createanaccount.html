<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up - Plannery</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #faf7f2;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      max-width: 380px;
      width: 90%;
      margin: 40px auto;
      padding: 35px 30px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      text-align: center;
      box-sizing: border-box;
    }
    .card h2 {
      margin-top: 0;
      color: #29231c;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
      transition: border-color 0.15s ease;
    }
    input:focus {
      outline: none;
      border-color: #cd6f01;
    }
    button {
      width: 100%;
      height: 46px;
      font-size: 16px;
      border-radius: 8px;
      font-weight: bold;
      background-color: #cd6f01;
      color: white;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }
    button:hover {
      opacity: 0.88;
    }
    button:active {
      transform: scale(0.98);
    }
    a {
      color: #cd6f01;
      font-weight: bold;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    #notif-prompt button {
      height: 38px;
      font-size: 14px;
    }
    #notif-prompt button:nth-of-type(2) {
      background-color: #eee;
      color: #333;
    }
  </style>
</head>
<body>


  <select id="lang-switcher" onchange="localStorage.setItem('plannery-language', this.value); applySignupLanguage();" style="position: fixed; top: 15px; right: 15px; padding: 8px; border-radius: 8px; border: 1px solid #ddd; font-size: 13px; background-color: white;">
    <option value="en">🌐 English</option>
    <option value="es">🌐 Español</option>
    <option value="pl">🌐 Polski</option>
    <option value="fr">🌐 Français</option>
    <option value="zh">🌐 中文</option>
    <option value="pt">🌐 Português</option>
    <option value="de">🌐 Deutsch</option>
    <option value="it">🌐 Italiano</option>
    <option value="hi">🌐 हिन्दी</option>
  </select>

  <div class="card">
    <img src="plannery_logo.png" style="width: 180px; height: auto; margin-bottom: 10px;">
    <h2 id="i18n-heading">Sign Up</h2>
    <input type="text" id="signup-username" placeholder="Username" autocomplete="off">
    <input type="email" id="signup-email" placeholder="Email">
    <input type="password" id="signup-password" placeholder="Password">
    <button onclick="signUp()" id="i18n-btn">Sign Up</button>
    <p id="signup-message" style="color: red; font-size: 14px;"></p>

    <div id="notif-prompt" style="display:none; margin-top: 15px; padding: 15px; border: 2px solid #cd6f01; border-radius: 10px; text-align: left;">
      <p style="font-weight: bold; margin-top: 0;">🔔 Want reminders before your tasks start?</p>
      <p style="font-size: 13px; color: #555;">We can notify you 15 minutes before a task begins, while your browser is open.</p>
      <div style="display: flex; gap: 10px;">
        <button onclick="enableNotifPrompt()" style="flex: 1;">Yes, enable</button>
        <button onclick="dismissNotifPrompt()" style="flex: 1;">Not now</button>
      </div>
    </div>

    <p style="font-size: 14px;"><span id="i18n-haveaccount">Already have an account?</span> <a href="login.html" id="i18n-login">Log in</a></p>
  </div>

  <script>
    async function enableNotifPrompt() {
      if ('Notification' in window) {
        await Notification.requestPermission();
      }
      document.getElementById('notif-prompt').style.display = "none";
    }

    function dismissNotifPrompt() {
      const box = document.getElementById('notif-prompt');
      box.innerHTML = `
        <p style="font-weight: bold; margin-top: 0;">No problem!</p>
        <p style="font-size: 13px; color: #555;">You can turn on notifications anytime later:</p>
        <p style="font-size: 13px; color: #555; margin-left: 5px;">
          1. Log in to your account<br>
          2. Click the ⚙️ gear icon (top right)<br>
          3. Click "🔔 Enable Notifications"
        </p>
        <button onclick="document.getElementById('notif-prompt').style.display='none';" style="height: 34px;">Got it</button>
      `;
    }
  </script>

  <script>
    async function signUp() {
      const username = document.getElementById('signup-username').value.trim();
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const messageEl = document.getElementById('signup-message');
      messageEl.style.color = "red";

      if (!username) {
        messageEl.textContent = "Please choose a username.";
        return;
      }

      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: {
          emailRedirectTo: new URL('email-confirmed.html', window.location.href).toString()
        }
      });

      if (error) {
        messageEl.textContent = error.message;
        return;
      }

      // We can't save the username to the profiles table yet, because there's
      // no active session until the user confirms their email and logs in.
      // Save it locally for now; the dashboard will create the profile
      // using this value the first time the user actually logs in.
      localStorage.setItem('plannery-pending-username', username);

      messageEl.style.color = "green";
      messageEl.textContent = "Account created! Check your email to confirm.";

      if ('Notification' in window && Notification.permission === 'default') {
        document.getElementById('notif-prompt').style.display = "block";
      }
    }
  </script>

  <script>
    const signupTranslations = {
      en: { heading: "Sign Up", usernamePh: "Username", emailPh: "Email", passPh: "Password", btn: "Sign Up", haveAccount: "Already have an account?", logIn: "Log in" },
      es: { heading: "Crear cuenta", usernamePh: "Nombre de usuario", emailPh: "Correo electrónico", passPh: "Contraseña", btn: "Crear cuenta", haveAccount: "¿Ya tienes una cuenta?", logIn: "Inicia sesión" },
      pl: { heading: "Utwórz konto", usernamePh: "Nazwa użytkownika", emailPh: "Email", passPh: "Hasło", btn: "Utwórz konto", haveAccount: "Masz już konto?", logIn: "Zaloguj się" },
      fr: { heading: "Créer un compte", usernamePh: "Nom d'utilisateur", emailPh: "Email", passPh: "Mot de passe", btn: "Créer un compte", haveAccount: "Vous avez déjà un compte ?", logIn: "Se connecter" },
      zh: { heading: "创建账户", usernamePh: "用户名", emailPh: "邮箱", passPh: "密码", btn: "创建账户", haveAccount: "已有账户？", logIn: "登录" },
      pt: { heading: "Criar conta", usernamePh: "Nome de usuário", emailPh: "Email", passPh: "Senha", btn: "Criar conta", haveAccount: "Já tem uma conta?", logIn: "Entrar" },
      de: { heading: "Konto erstellen", usernamePh: "Benutzername", emailPh: "E-Mail", passPh: "Passwort", btn: "Konto erstellen", haveAccount: "Schon ein Konto?", logIn: "Anmelden" },
      it: { heading: "Crea account", usernamePh: "Nome utente", emailPh: "Email", passPh: "Password", btn: "Crea account", haveAccount: "Hai già un account?", logIn: "Accedi" },
      hi: { heading: "खाता बनाएं", usernamePh: "उपयोगकर्ता नाम", emailPh: "ईमेल", passPh: "पासवर्ड", btn: "खाता बनाएं", haveAccount: "पहले से खाता है?", logIn: "लॉग इन करें" }
    };

    function applySignupLanguage() {
      const lang = localStorage.getItem('plannery-language') || 'en';
      const t = signupTranslations[lang] || signupTranslations.en;
      document.getElementById('i18n-heading').textContent = t.heading;
      document.getElementById('signup-username').placeholder = t.usernamePh;
      document.getElementById('signup-email').placeholder = t.emailPh;
      document.getElementById('signup-password').placeholder = t.passPh;
      document.getElementById('i18n-btn').textContent = t.btn;
      document.getElementById('i18n-haveaccount').textContent = t.haveAccount;
      document.getElementById('i18n-login').textContent = t.logIn;
    }
    document.getElementById('lang-switcher').value = localStorage.getItem('plannery-language') || 'en';
    applySignupLanguage();
  </script>

</body>
</html>
