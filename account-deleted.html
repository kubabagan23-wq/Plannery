<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account Deleted - Plannery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #faf7f2;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      max-width: 420px;
      width: 90%;
      margin: 40px auto;
      padding: 40px 30px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      text-align: center;
      box-sizing: border-box;
    }
    .icon {
      font-size: 60px;
      margin-bottom: 10px;
    }
    h2 {
      margin-top: 0;
      color: #29231c;
    }
    p {
      color: #555;
      font-size: 15px;
    }
    .slogan {
      color: #cd6f01;
      font-weight: bold;
      font-size: 16px;
      margin-top: 15px;
    }
    a.button {
      display: inline-block;
      margin-top: 25px;
      width: 100%;
      height: 46px;
      line-height: 46px;
      font-size: 16px;
      border-radius: 8px;
      font-weight: bold;
      background-color: #cd6f01;
      color: white;
      text-decoration: none;
      box-sizing: border-box;
      transition: opacity 0.15s ease;
    }
    a.button:hover {
      opacity: 0.88;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="plannery_logo.png" style="width: 160px; height: auto; margin-bottom: 15px;">
    <div class="icon">👋</div>
    <h2>Your account has been deleted</h2>
    <p>All your tasks, photos, and account data have been permanently removed. We're sorry to see you go.</p>
    <p class="slogan">All your plans in one place — plan smarter, live better.</p>
    <a href="index.html" class="button">Back to Homepage</a>
  </div>

</body>
</html>
