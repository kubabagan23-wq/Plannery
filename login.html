<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Log In - Plannery</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #faf7f2;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      max-width: 380px;
      width: 90%;
      margin: 40px auto;
      padding: 35px 30px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      text-align: center;
      box-sizing: border-box;
    }
    .card h2 {
      margin-top: 0;
      color: #29231c;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
      transition: border-color 0.15s ease;
    }
    input:focus {
      outline: none;
      border-color: #cd6f01;
    }
    button {
      width: 100%;
      height: 46px;
      font-size: 16px;
      border-radius: 8px;
      font-weight: bold;
      background-color: #cd6f01;
      color: white;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }
    button:hover {
      opacity: 0.88;
    }
    button:active {
      transform: scale(0.98);
    }
    a {
      color: #cd6f01;
      font-weight: bold;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 46px; }
    button.pw-toggle {
      position: absolute;
      right: 6px;
      top: 4px;
      width: 36px;
      height: 36px;
      padding: 0;
      font-size: 18px;
      background: transparent;
      color: #555;
      border-radius: 8px;
    }
    button.pw-toggle:hover { opacity: 0.7; }
  </style>
</head>
<body>


  <select id="lang-switcher" onchange="localStorage.setItem('plannery-language', this.value); applyLoginLanguage();" style="position: fixed; top: 15px; right: 15px; padding: 8px; border-radius: 8px; border: 1px solid #ddd; font-size: 13px; background-color: white;">
    <option value="en">🌐 English</option>
    <option value="es">🌐 Español</option>
    <option value="pl">🌐 Polski</option>
    <option value="fr">🌐 Français</option>
    <option value="zh">🌐 中文</option>
    <option value="pt">🌐 Português</option>
    <option value="de">🌐 Deutsch</option>
    <option value="it">🌐 Italiano</option>
    <option value="hi">🌐 हिन्दी</option>
  </select>

  <div class="card">
    <img src="plannery_logo.png" style="width: 180px; height: auto; margin-bottom: 10px;">
    <h2 id="i18n-heading">Log In</h2>
    <input type="email" id="login-email" placeholder="Email">
    <div class="pw-wrap">
      <input type="password" id="login-password" placeholder="Password">
      <button type="button" class="pw-toggle" id="pw-toggle" onclick="togglePassword()" aria-label="Show password">👁️</button>
    </div>
    <button onclick="logIn()" id="i18n-btn">Log In</button>
    <p style="font-size: 14px; margin: 12px 0 0 0;"><a href="#" id="i18n-forgot" onclick="forgotPassword(); return false;">Forgot password?</a></p>
    <p id="login-message" style="color: red; font-size: 14px;"></p>
    <p style="font-size: 14px;"><span id="i18n-noaccount">Don't have an account?</span> <a href="createanaccount.html" id="i18n-signup">Sign up</a></p>
  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById('login-password');
      const btn = document.getElementById('pw-toggle');
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.textContent = show ? '🙈' : '👁️';
      btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    }

    async function forgotPassword() {
      const lang = localStorage.getItem('plannery-language') || 'en';
      const t = loginTranslations[lang] || loginTranslations.en;
      const messageEl = document.getElementById('login-message');
      const email = document.getElementById('login-email').value.trim();
      messageEl.style.color = "red";

      if (!email) {
        messageEl.textContent = t.needEmail;
        return;
      }

      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: new URL('reset-password.html', window.location.href).toString()
      });

      if (error) {
        messageEl.textContent = error.message;
        return;
      }

      messageEl.style.color = "green";
      messageEl.textContent = t.sent;
    }

    async function logIn() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        document.getElementById('login-message').textContent = error.message;
        return;
      }

      document.getElementById('login-message').style.color = "green";
      document.getElementById('login-message').textContent = "Logged in!";

      // Small delay before redirecting - gives the browser a moment to
      // finish writing the session to storage before navigating away
      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 300);
    }
  </script>

  <script>
    const loginTranslations = {
      en: { heading: "Log In", emailPh: "Email", passPh: "Password", btn: "Log In", noAccount: "Don't have an account?", signUp: "Sign up", forgot: "Forgot password?", needEmail: "Type your email above first, then click Forgot password again.", sent: "If an account exists for that email, a password reset link has been sent." },
      es: { heading: "Iniciar sesión", emailPh: "Correo electrónico", passPh: "Contraseña", btn: "Iniciar sesión", noAccount: "¿No tienes una cuenta?", signUp: "Regístrate", forgot: "¿Olvidaste tu contraseña?", needEmail: "Escribe tu correo arriba y vuelve a hacer clic en ¿Olvidaste tu contraseña?", sent: "Si existe una cuenta con ese correo, se ha enviado un enlace para restablecer la contraseña." },
      pl: { heading: "Zaloguj się", emailPh: "Email", passPh: "Hasło", btn: "Zaloguj się", noAccount: "Nie masz konta?", signUp: "Zarejestruj się", forgot: "Nie pamiętasz hasła?", needEmail: "Najpierw wpisz swój email powyżej, a potem kliknij ponownie Nie pamiętasz hasła?", sent: "Jeśli istnieje konto z tym adresem email, wysłaliśmy link do zresetowania hasła." },
      fr: { heading: "Se connecter", emailPh: "Email", passPh: "Mot de passe", btn: "Se connecter", noAccount: "Vous n'avez pas de compte ?", signUp: "S'inscrire", forgot: "Mot de passe oublié ?", needEmail: "Saisissez d'abord votre email ci-dessus, puis cliquez à nouveau sur Mot de passe oublié.", sent: "Si un compte existe pour cet email, un lien de réinitialisation a été envoyé." },
      zh: { heading: "登录", emailPh: "邮箱", passPh: "密码", btn: "登录", noAccount: "还没有账户？", signUp: "注册", forgot: "忘记密码？", needEmail: "请先在上方输入邮箱，然后再次点击“忘记密码”。", sent: "如果该邮箱对应的账户存在，我们已发送密码重置链接。" },
      pt: { heading: "Entrar", emailPh: "Email", passPh: "Senha", btn: "Entrar", noAccount: "Não tem uma conta?", signUp: "Cadastre-se", forgot: "Esqueceu a senha?", needEmail: "Digite seu email acima primeiro e clique em Esqueceu a senha novamente.", sent: "Se existir uma conta com esse email, enviamos um link para redefinir a senha." },
      de: { heading: "Anmelden", emailPh: "E-Mail", passPh: "Passwort", btn: "Anmelden", noAccount: "Noch kein Konto?", signUp: "Registrieren", forgot: "Passwort vergessen?", needEmail: "Gib oben zuerst deine E-Mail ein und klicke dann erneut auf Passwort vergessen.", sent: "Falls ein Konto mit dieser E-Mail existiert, wurde ein Link zum Zurücksetzen gesendet." },
      it: { heading: "Accedi", emailPh: "Email", passPh: "Password", btn: "Accedi", noAccount: "Non hai un account?", signUp: "Registrati", forgot: "Password dimenticata?", needEmail: "Inserisci prima la tua email qui sopra, poi clicca di nuovo su Password dimenticata.", sent: "Se esiste un account con questa email, è stato inviato un link per reimpostare la password." },
      hi: { heading: "लॉग इन करें", emailPh: "ईमेल", passPh: "पासवर्ड", btn: "लॉग इन करें", noAccount: "खाता नहीं है?", signUp: "साइन अप करें", forgot: "पासवर्ड भूल गए?", needEmail: "पहले ऊपर अपना ईमेल दर्ज करें, फिर दोबारा पासवर्ड भूल गए पर क्लिक करें।", sent: "यदि इस ईमेल का खाता मौजूद है, तो पासवर्ड रीसेट लिंक भेज दिया गया है।" }
    };

    function applyLoginLanguage() {
      const lang = localStorage.getItem('plannery-language') || 'en';
      const t = loginTranslations[lang] || loginTranslations.en;
      document.getElementById('i18n-heading').textContent = t.heading;
      document.getElementById('login-email').placeholder = t.emailPh;
      document.getElementById('login-password').placeholder = t.passPh;
      document.getElementById('i18n-btn').textContent = t.btn;
      document.getElementById('i18n-forgot').textContent = t.forgot;
      document.getElementById('i18n-noaccount').textContent = t.noAccount;
      document.getElementById('i18n-signup').textContent = t.signUp;
    }
    document.getElementById('lang-switcher').value = localStorage.getItem('plannery-language') || 'en';
    applyLoginLanguage();
  </script>

</body>
</html>
