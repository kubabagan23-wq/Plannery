<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log In - Plannery</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #faf7f2;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      max-width: 380px;
      width: 90%;
      margin: 40px auto;
      padding: 35px 30px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      text-align: center;
      box-sizing: border-box;
    }
    .card h2 {
      margin-top: 0;
      color: #29231c;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
      transition: border-color 0.15s ease;
    }
    input:focus {
      outline: none;
      border-color: #cd6f01;
    }
    button {
      width: 100%;
      height: 46px;
      font-size: 16px;
      border-radius: 8px;
      font-weight: bold;
      background-color: #cd6f01;
      color: white;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }
    button:hover {
      opacity: 0.88;
    }
    button:active {
      transform: scale(0.98);
    }
    a {
      color: #cd6f01;
      font-weight: bold;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="plannery_logo.png" style="width: 180px; height: auto; margin-bottom: 10px;">
    <h2 id="i18n-heading">Log In</h2>
    <input type="email" id="login-email" placeholder="Email">
    <input type="password" id="login-password" placeholder="Password">
    <button onclick="logIn()" id="i18n-btn">Log In</button>
    <p id="login-message" style="color: red; font-size: 14px;"></p>
    <p style="font-size: 14px;"><span id="i18n-noaccount">Don't have an account?</span> <a href="createanaccount.html" id="i18n-signup">Sign up</a></p>
  </div>

  <script>
    async function logIn() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        document.getElementById('login-message').textContent = error.message;
        return;
      }

      document.getElementById('login-message').style.color = "green";
      document.getElementById('login-message').textContent = "Logged in!";

      // Small delay before redirecting - gives the browser a moment to
      // finish writing the session to storage before navigating away
      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 300);
    }
  </script>

  <script>
    const loginTranslations = {
      en: { heading: "Log In", emailPh: "Email", passPh: "Password", btn: "Log In", noAccount: "Don't have an account?", signUp: "Sign up" },
      es: { heading: "Iniciar sesión", emailPh: "Correo electrónico", passPh: "Contraseña", btn: "Iniciar sesión", noAccount: "¿No tienes una cuenta?", signUp: "Regístrate" },
      pl: { heading: "Zaloguj się", emailPh: "Email", passPh: "Hasło", btn: "Zaloguj się", noAccount: "Nie masz konta?", signUp: "Zarejestruj się" },
      fr: { heading: "Se connecter", emailPh: "Email", passPh: "Mot de passe", btn: "Se connecter", noAccount: "Vous n'avez pas de compte ?", signUp: "S'inscrire" },
      zh: { heading: "登录", emailPh: "邮箱", passPh: "密码", btn: "登录", noAccount: "还没有账户？", signUp: "注册" },
      pt: { heading: "Entrar", emailPh: "Email", passPh: "Senha", btn: "Entrar", noAccount: "Não tem uma conta?", signUp: "Cadastre-se" },
      de: { heading: "Anmelden", emailPh: "E-Mail", passPh: "Passwort", btn: "Anmelden", noAccount: "Noch kein Konto?", signUp: "Registrieren" },
      it: { heading: "Accedi", emailPh: "Email", passPh: "Password", btn: "Accedi", noAccount: "Non hai un account?", signUp: "Registrati" },
      hi: { heading: "लॉग इन करें", emailPh: "ईमेल", passPh: "पासवर्ड", btn: "लॉग इन करें", noAccount: "खाता नहीं है?", signUp: "साइन अप करें" }
    };

    function applyLoginLanguage() {
      const lang = localStorage.getItem('plannery-language') || 'en';
      const t = loginTranslations[lang] || loginTranslations.en;
      document.getElementById('i18n-heading').textContent = t.heading;
      document.getElementById('login-email').placeholder = t.emailPh;
      document.getElementById('login-password').placeholder = t.passPh;
      document.getElementById('i18n-btn').textContent = t.btn;
      document.getElementById('i18n-noaccount').textContent = t.noAccount;
      document.getElementById('i18n-signup').textContent = t.signUp;
    }
    applyLoginLanguage();
  </script>

</body>
</html>
