<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Reset Password - Plannery</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #faf7f2;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      max-width: 380px;
      width: 90%;
      margin: 40px auto;
      padding: 35px 30px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      text-align: center;
      box-sizing: border-box;
    }
    .card h2 {
      margin-top: 0;
      color: #29231c;
    }
    input[type="password"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
      transition: border-color 0.15s ease;
    }
    input[type="password"]:focus {
      outline: none;
      border-color: #cd6f01;
    }
    button {
      width: 100%;
      height: 46px;
      font-size: 16px;
      border-radius: 8px;
      font-weight: bold;
      background-color: #cd6f01;
      color: white;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }
    button:hover { opacity: 0.88; }
    button:active { transform: scale(0.98); }
    a {
      color: #cd6f01;
      font-weight: bold;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <select id="lang-switcher" onchange="localStorage.setItem('plannery-language', this.value); applyResetLanguage();" style="position: fixed; top: 15px; right: 15px; padding: 8px; border-radius: 8px; border: 1px solid #ddd; font-size: 13px; background-color: white;">
    <option value="en">🌐 English</option>
    <option value="es">🌐 Español</option>
    <option value="pl">🌐 Polski</option>
    <option value="fr">🌐 Français</option>
    <option value="zh">🌐 中文</option>
    <option value="pt">🌐 Português</option>
    <option value="de">🌐 Deutsch</option>
    <option value="it">🌐 Italiano</option>
    <option value="hi">🌐 हिन्दी</option>
  </select>

  <div class="card">
    <img src="plannery_logo.png" style="width: 180px; height: auto; margin-bottom: 10px;">
    <h2 id="i18n-heading">Set a new password</h2>
    <input type="password" id="new-password" autocomplete="new-password">
    <input type="password" id="confirm-password" autocomplete="new-password">
    <button onclick="savePassword()" id="i18n-btn">Save password</button>
    <p id="reset-message" style="color: red; font-size: 14px;"></p>
    <p style="font-size: 14px;"><a href="login.html" id="i18n-back">Back to log in</a></p>
  </div>

  <script>
    const resetTranslations = {
      en: { heading: "Set a new password", newPh: "New password", confirmPh: "Confirm new password", btn: "Save password", mismatch: "The passwords don't match.", short: "Password must be at least 6 characters.", success: "Password updated! Taking you to log in...", invalid: "This reset link is invalid or has expired. Please request a new one from the log in page.", back: "Back to log in" },
      es: { heading: "Establece una nueva contraseña", newPh: "Nueva contraseña", confirmPh: "Confirma la nueva contraseña", btn: "Guardar contraseña", mismatch: "Las contraseñas no coinciden.", short: "La contraseña debe tener al menos 6 caracteres.", success: "¡Contraseña actualizada! Te llevamos a iniciar sesión...", invalid: "Este enlace no es válido o ha caducado. Solicita uno nuevo desde la página de inicio de sesión.", back: "Volver a iniciar sesión" },
      pl: { heading: "Ustaw nowe hasło", newPh: "Nowe hasło", confirmPh: "Potwierdź nowe hasło", btn: "Zapisz hasło", mismatch: "Hasła nie są takie same.", short: "Hasło musi mieć co najmniej 6 znaków.", success: "Hasło zaktualizowane! Przenosimy Cię do logowania...", invalid: "Ten link jest nieprawidłowy lub wygasł. Poproś o nowy na stronie logowania.", back: "Wróć do logowania" },
      fr: { heading: "Définir un nouveau mot de passe", newPh: "Nouveau mot de passe", confirmPh: "Confirmez le nouveau mot de passe", btn: "Enregistrer le mot de passe", mismatch: "Les mots de passe ne correspondent pas.", short: "Le mot de passe doit contenir au moins 6 caractères.", success: "Mot de passe mis à jour ! Redirection vers la connexion...", invalid: "Ce lien est invalide ou a expiré. Demandez-en un nouveau depuis la page de connexion.", back: "Retour à la connexion" },
      zh: { heading: "设置新密码", newPh: "新密码", confirmPh: "确认新密码", btn: "保存密码", mismatch: "两次输入的密码不一致。", short: "密码至少需要6个字符。", success: "密码已更新！正在跳转到登录页面...", invalid: "此重置链接无效或已过期。请在登录页面重新申请。", back: "返回登录" },
      pt: { heading: "Defina uma nova senha", newPh: "Nova senha", confirmPh: "Confirme a nova senha", btn: "Salvar senha", mismatch: "As senhas não coincidem.", short: "A senha deve ter pelo menos 6 caracteres.", success: "Senha atualizada! Levando você para o login...", invalid: "Este link é inválido ou expirou. Solicite um novo na página de login.", back: "Voltar ao login" },
      de: { heading: "Neues Passwort festlegen", newPh: "Neues Passwort", confirmPh: "Neues Passwort bestätigen", btn: "Passwort speichern", mismatch: "Die Passwörter stimmen nicht überein.", short: "Das Passwort muss mindestens 6 Zeichen lang sein.", success: "Passwort aktualisiert! Du wirst zur Anmeldung weitergeleitet...", invalid: "Dieser Link ist ungültig oder abgelaufen. Fordere auf der Anmeldeseite einen neuen an.", back: "Zurück zur Anmeldung" },
      it: { heading: "Imposta una nuova password", newPh: "Nuova password", confirmPh: "Conferma la nuova password", btn: "Salva password", mismatch: "Le password non corrispondono.", short: "La password deve contenere almeno 6 caratteri.", success: "Password aggiornata! Ti portiamo all'accesso...", invalid: "Questo link non è valido o è scaduto. Richiedine uno nuovo dalla pagina di accesso.", back: "Torna all'accesso" },
      hi: { heading: "नया पासवर्ड सेट करें", newPh: "नया पासवर्ड", confirmPh: "नए पासवर्ड की पुष्टि करें", btn: "पासवर्ड सहेजें", mismatch: "पासवर्ड मेल नहीं खाते।", short: "पासवर्ड कम से कम 6 अक्षरों का होना चाहिए।", success: "पासवर्ड अपडेट हो गया! लॉग इन पेज पर ले जा रहे हैं...", invalid: "यह लिंक अमान्य है या समाप्त हो गया है। कृपया लॉग इन पेज से नया अनुरोध करें।", back: "लॉग इन पर वापस जाएं" }
    };

    function currentResetText() {
      const lang = localStorage.getItem('plannery-language') || 'en';
      return resetTranslations[lang] || resetTranslations.en;
    }

    function applyResetLanguage() {
      const t = currentResetText();
      document.getElementById('i18n-heading').textContent = t.heading;
      document.getElementById('new-password').placeholder = t.newPh;
      document.getElementById('confirm-password').placeholder = t.confirmPh;
      document.getElementById('i18n-btn').textContent = t.btn;
      document.getElementById('i18n-back').textContent = t.back;
    }

    async function savePassword() {
      const t = currentResetText();
      const messageEl = document.getElementById('reset-message');
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      messageEl.style.color = "red";

      if (newPassword.length < 6) {
        messageEl.textContent = t.short;
        return;
      }
      if (newPassword !== confirmPassword) {
        messageEl.textContent = t.mismatch;
        return;
      }

      // The link in the email signs the person in temporarily, just for this
      const { data } = await supabaseClient.auth.getSession();
      if (!data.session) {
        messageEl.textContent = t.invalid;
        return;
      }

      const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
      if (error) {
        messageEl.textContent = error.message;
        return;
      }

      messageEl.style.color = "green";
      messageEl.textContent = t.success;
      await supabaseClient.auth.signOut();
      setTimeout(() => { window.location.href = "login.html"; }, 2000);
    }

    document.getElementById('lang-switcher').value = localStorage.getItem('plannery-language') || 'en';
    applyResetLanguage();
  </script>

</body>
</html>
