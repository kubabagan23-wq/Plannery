<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Dashboard - Plannery</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <style>
    button {
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
      border: 1px solid rgba(0,0,0,0.15);
    }
    input[type="text"], input[type="time"], input[type="email"], input[type="password"],
    input[type="color"], input[type="file"], input[type="number"], textarea, select {
      background-color: #e8e8e8;
      color: #000000;
      border: 1px solid #bbb;
    }
    input[type="text"]:focus, input[type="time"]:focus, input[type="email"]:focus,
    input[type="password"]:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #cd6f01;
      background-color: #f0f0f0;
    }
    button:hover {
      opacity: 0.85;
    }
    button:active {
      transform: scale(0.97);
    }
    #save-task-btn, #save-username-btn, #save-password-btn, #save-email-btn {
      background-color: #cd6f01;
      color: white;
      border: none;
    }
    #month-label {
      letter-spacing: 0.5px;
    }
    .day-cell {
      transition: box-shadow 0.15s ease, transform 0.1s ease;
    }
    .day-cell:hover {
      box-shadow: 0 0 0 2px #cd6f01 inset;
      transform: translateY(-1px);
    }
    .sidebar-box, #task-panel, #settings-panel {
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }
    #username-label {
      color: #cd6f01;
    }
    #account-toggle-btn, .day-name {
      border: none;
      background: transparent;
    }
    @media (max-width: 700px) {
      #main-content {
        flex-direction: column !important;
      }
      #calendar {
        width: 100% !important;
        grid-template-columns: repeat(7, minmax(30px, 1fr)) !important;
        gap: 3px !important;
      }
      .day-cell {
        min-height: 50px !important;
        padding: 3px !important;
      }
      .day-num {
        font-size: 11px !important;
      }
      .task-tag {
        font-size: 9px !important;
        padding: 1px 2px !important;
      }
      .day-name {
        font-size: 11px !important;
        padding: 4px !important;
      }
      #corner-clock {
        width: 140px !important;
        height: 44px !important;
        font-size: 14px !important;
        bottom: 10px !important;
        right: 10px !important;
      }
      .sidebar-box {
        width: 100% !important;
      }
      #month-label {
        font-size: 20px !important;
        margin: 0 8px !important;
      }
      #task-panel {
        max-width: 92% !important;
        margin: 20px auto !important;
      }
    }
  </style>
</head>
<body id="app-body" style="font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: white; color: black;">

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 30px; background-color: inherit; border-bottom: 2px solid currentColor;">
    <img src="plannery_logo.png" style="width: 150px; height: auto;">
    <div style="display: flex; align-items: center; gap: 15px;">
      <span id="username-label" style="font-weight: bold;"></span>
      <button onclick="openSettings()" title="Settings" style="width: 40px; height: 40px; font-size: 18px; border-radius: 50%; font-weight: bold; cursor: pointer;">⚙️</button>
    </div>
  </div>

  <div id="main-content" style="display: flex; align-items: flex-start; gap: 20px; padding: 20px; flex-wrap: wrap;">

    <div style="flex: 1; min-width: 320px;">
      <div style="text-align: center; margin: 10px 0 30px 0;">
        <button onclick="changeMonth(-1)" style="width: 40px; height: 40px; font-size: 18px; border-radius: 8px; font-weight: bold;">←</button>
        <span id="month-label" style="font-size: 28px; font-weight: bold; margin: 0 20px;"></span>
        <button onclick="changeMonth(1)" style="width: 40px; height: 40px; font-size: 18px; border-radius: 8px; font-weight: bold;">→</button>
      </div>

      <div style="overflow-x: auto;">
        <div id="calendar" style="width: 1225px; max-width: 100%; display: grid; grid-template-columns: repeat(7, minmax(90px,175px)); gap: 5px;"></div>
      </div>
    </div>

    <div class="sidebar-box" style="width: 280px; flex-shrink: 0; border: 2px solid currentColor; border-radius: 10px; padding: 15px; box-sizing: border-box;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <button id="agenda-prev-btn" onclick="agendaShift(-1)" style="width: 30px; height: 30px; border-radius: 6px; font-weight: bold;">←</button>
        <div style="text-align: center;">
          <div id="agenda-date-label" style="font-weight: bold; font-size: 14px;"></div>
          <div id="agenda-today-tag" style="font-size: 11px; color: #cd6f01; font-weight: bold;"></div>
        </div>
        <button id="agenda-next-btn" onclick="agendaShift(1)" style="width: 30px; height: 30px; border-radius: 6px; font-weight: bold;">→</button>
      </div>
      <button onclick="agendaResetToday()" id="back-to-today-btn" style="width: 100%; height: 28px; font-size: 12px; border-radius: 6px; margin-bottom: 10px;"></button>
      <div id="agenda-list"></div>
    </div>

  </div>

  <div id="task-panel-overlay" style="display:none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.55); z-index: 998; overflow-y: auto; box-sizing: border-box; align-items: flex-start; justify-content: center;" onclick="closeTaskPanelOverlay(event)">
  <div id="task-panel" style="max-width: 420px; width: 92%; margin: 40px auto; padding: 20px; border: 2px solid currentColor; border-radius: 10px; position: relative; opacity: 0; transform: scale(0.9); transition: opacity 0.25s ease, transform 0.25s ease; box-sizing: border-box; background-color: inherit; color: inherit; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
    <button onclick="closeTaskPanel()" style="position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%; background-color: red; color: white; border: none; font-weight: bold; font-size: 16px; cursor: pointer;">✕</button>
    <h3 id="task-date-label"></h3>
    <div id="holiday-banner" style="display:none; font-size: 13px; margin-bottom: 10px;"></div>
    <div id="task-list"></div>

    <hr>

    <h4 id="form-heading" style="margin-bottom: 5px;"></h4>

    <label id="label-title" style="font-weight: bold; font-size: 14px;"></label>
    <input type="text" id="new-task-title" autocomplete="off" style="width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 10px; box-sizing: border-box;">

    <label id="label-from" style="font-weight: bold; font-size: 14px;"></label>
    <input type="time" id="new-task-start" style="width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 10px; box-sizing: border-box;">

    <label id="label-to" style="font-weight: bold; font-size: 14px;"></label>
    <input type="time" id="new-task-end" style="width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 10px; box-sizing: border-box;">

    <label id="label-location" style="font-weight: bold; font-size: 14px;"></label>
    <input type="text" id="new-task-location" autocomplete="off" style="width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 10px; box-sizing: border-box;">

    <label id="label-description" style="font-weight: bold; font-size: 14px;"></label>
    <textarea id="new-task-description" rows="2" oninput="autoGrowTextarea(this)" style="width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 10px; box-sizing: border-box; font-family: Arial, sans-serif; overflow: hidden; resize: none;"></textarea>

    <label id="label-note" style="font-weight: bold; font-size: 14px;"></label>
    <textarea id="new-task-note" rows="2" oninput="autoGrowTextarea(this)" style="width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 10px; box-sizing: border-box; font-family: Arial, sans-serif; overflow: hidden; resize: none;"></textarea>

    <label id="label-attachment" style="font-weight: bold; font-size: 14px;"></label>
    <input type="file" id="new-task-photo" accept="image/*" style="width: 100%; margin-top: 5px; margin-bottom: 10px;">

    <label id="label-repeat" style="font-weight: bold; font-size: 14px;"></label><br>
    <select id="new-task-repeat" onchange="toggleCustomRepeatFields()" style="width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 10px; box-sizing: border-box;">
      <option value="none" id="opt-repeat-none">Does not repeat</option>
      <option value="daily" id="opt-repeat-daily">Every day</option>
      <option value="weekly" id="opt-repeat-weekly">Every week</option>
      <option value="monthly" id="opt-repeat-monthly">Every month</option>
      <option value="yearly" id="opt-repeat-yearly">Every year</option>
      <option value="custom" id="opt-repeat-custom">Custom...</option>
    </select>

    <div id="custom-repeat-fields" style="display:none; margin-bottom: 10px;">
      <span id="label-every">Every</span>
      <input type="number" id="new-task-repeat-interval" min="1" value="1" style="width: 60px; padding: 8px; margin: 0 6px; box-sizing: border-box;">
      <select id="new-task-repeat-unit" style="padding: 8px;">
        <option value="days" id="opt-unit-days">Days</option>
        <option value="weeks" id="opt-unit-weeks">Weeks</option>
        <option value="months" id="opt-unit-months">Months</option>
        <option value="years" id="opt-unit-years">Years</option>
      </select>
    </div>

    <label id="label-color" style="font-weight: bold; font-size: 14px;"></label><br>
    <input type="color" id="new-task-color" value="#cd6f01" style="width: 60px; height: 40px; margin-top: 5px; margin-bottom: 10px; border: none; padding: 0; cursor: pointer;">

    <button onclick="saveTask()" id="save-task-btn" style="width: 100%; height: 40px; margin-top: 5px; border-radius: 8px; font-weight: bold;"></button>
    <button onclick="cancelEdit()" id="cancel-edit-btn" style="display: none; width: 100%; height: 35px; margin-top: 8px; border-radius: 8px;"></button>
    <p id="task-error-message" style="color: red; font-size: 13px; margin-top: 8px;"></p>
  </div>
  </div>

  <div id="settings-overlay" style="display:none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 999; overflow-y: auto; box-sizing: border-box;" onclick="closeSettingsOverlay(event)">
    <div id="settings-panel" style="background-color: inherit; color: inherit; max-width: 360px; margin: 40px auto; padding: 20px; border-radius: 10px; position: relative; box-sizing: border-box; border: 2px solid currentColor;">
      <button onclick="closeSettings()" style="position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%; background-color: red; color: white; border: none; font-weight: bold; font-size: 16px; cursor: pointer;">✕</button>
      <h3 id="settings-title"></h3>

      <button onclick="toggleNotifications()" id="notifications-toggle-btn" style="width: 100%; text-align: left; padding: 10px; border-radius: 8px; font-weight: bold; margin-bottom: 10px;"></button>
      <p id="notifications-status" style="font-size: 12px; color: #777; margin-top: -5px;"></p>

      <button onclick="document.getElementById('ics-file-input').click()" id="import-cal-btn" style="width: 100%; text-align: left; padding: 10px; border-radius: 8px; font-weight: bold; margin-bottom: 5px;"></button>
      <p id="import-cal-desc" style="font-size: 12px; color: #777; margin-top: -5px; margin-bottom: 10px;"></p>
      <input type="file" id="ics-file-input" accept=".ics" style="display:none" onchange="handleIcsUpload(event)">
      <p id="ics-import-status" style="font-size: 12px; margin-bottom: 15px;"></p>

      <button onclick="toggleAccountSection()" id="account-toggle-btn" style="width: 100%; text-align: left; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center;">
        <span id="label-account"></span>
        <span id="account-chevron">▾</span>
      </button>

      <div id="account-section" style="display: none; padding: 10px 5px; border-left: 2px solid #eee; margin-bottom: 10px;">

        <button onclick="toggleSubForm('username')" id="username-toggle-btn" style="width: 100%; text-align: left; padding: 8px; border-radius: 6px; cursor: pointer; margin-top: 5px;"></button>
        <div id="username-form" style="display:none; padding: 8px 0;">
          <input type="text" id="change-username-input" style="width: 100%; padding: 8px; box-sizing: border-box; margin-bottom: 8px;">
          <button onclick="saveUsername()" id="save-username-btn" style="width: 100%; height: 34px; border-radius: 6px; font-weight: bold;"></button>
          <p id="username-change-message" style="font-size: 12px; color: red; margin-top: 5px;"></p>
        </div>

        <button onclick="toggleSubForm('email')" id="email-toggle-btn" style="width: 100%; text-align: left; padding: 8px; border-radius: 6px; cursor: pointer; margin-top: 5px;"></button>
        <div id="email-form" style="display:none; padding: 8px 0;">
          <input type="email" id="change-email-input" style="width: 100%; padding: 8px; box-sizing: border-box; margin-bottom: 8px;">
          <button onclick="saveEmail()" id="save-email-btn" style="width: 100%; height: 34px; border-radius: 6px; font-weight: bold;"></button>
          <p id="email-change-message" style="font-size: 12px; color: red; margin-top: 5px;"></p>
        </div>

        <button onclick="toggleSubForm('password')" id="password-toggle-btn" style="width: 100%; text-align: left; padding: 8px; border-radius: 6px; cursor: pointer; margin-top: 5px;"></button>
        <div id="password-form" style="display:none; padding: 8px 0;">
          <input type="password" id="change-password-input" style="width: 100%; padding: 8px; box-sizing: border-box; margin-bottom: 8px;">
          <button onclick="savePassword()" id="save-password-btn" style="width: 100%; height: 34px; border-radius: 6px; font-weight: bold;"></button>
          <p id="password-change-message" style="font-size: 12px; color: red; margin-top: 5px;"></p>
        </div>

      </div>

      <label id="label-theme" style="font-weight: bold; font-size: 14px;"></label><br>
      <select id="theme-select" onchange="applyTheme(this.value)" style="width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; box-sizing: border-box;">
        <option value="light">Light (black on white)</option>
        <option value="dark">Dark (white on black)</option>
        <option value="blue">Blue on black</option>
        <option value="orange">Orange on black</option>
      </select>

      <label id="label-language" style="font-weight: bold; font-size: 14px;"></label><br>
      <select id="language-select" onchange="applyLanguage(this.value)" style="width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; box-sizing: border-box;">
        <option value="en">English</option>
        <option value="es">Español (Spanish)</option>
        <option value="pl">Polski (Polish)</option>
        <option value="fr">Français (French)</option>
        <option value="zh">中文 (Chinese)</option>
        <option value="pt">Português (Portuguese)</option>
        <option value="de">Deutsch (German)</option>
        <option value="it">Italiano (Italian)</option>
        <option value="hi">हिन्दी (Hindi)</option>
      </select>

      <label id="label-timeformat" style="font-weight: bold; font-size: 14px;"></label><br>
      <select id="timeformat-select" onchange="applyTimeFormat(this.value)" style="width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; box-sizing: border-box;">
        <option value="24" id="option-24h"></option>
        <option value="12" id="option-12h"></option>
      </select>

      <label id="label-holidays" style="font-weight: bold; font-size: 14px;"></label><br>
      <div id="holiday-list" style="max-height: 170px; overflow-y: auto; border: 1px solid #ccc; border-radius: 8px; padding: 6px 10px; margin-top: 5px; margin-bottom: 15px; box-sizing: border-box;"></div>

      <hr>

      <button onclick="logOut()" id="logout-btn" style="width: 100%; height: 40px; border-radius: 8px; font-weight: bold; margin-top: 10px;"></button>

      <button onclick="openDeleteAccountModal()" id="delete-btn" style="width: 100%; height: 40px; border-radius: 8px; margin-top: 10px; color: red;"></button>
      <p id="delete-info-message" style="font-size: 12px; color: #777; display:none;"></p>

      <hr>
      <p style="font-size: 13px; text-align: center; margin-top: 15px;">
        <span id="label-need-help">Need help or found an issue?</span><br>
        <a href="mailto:plannerysupport@gmail.com" style="color: #cd6f01; font-weight: bold;">plannerysupport@gmail.com</a>
      </p>
    </div>
  </div>

  <div id="delete-account-overlay" style="display:none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); z-index: 1001; align-items: center; justify-content: center;">
    <div style="background-color: inherit; color: inherit; max-width: 360px; width: 90%; padding: 20px; border-radius: 10px; box-sizing: border-box; border: 2px solid currentColor;">
      <h3 id="delete-modal-title" style="margin-top: 0; color: #d9534f;"></h3>
      <p id="delete-modal-desc" style="font-size: 13px; color: #555;"></p>

      <input type="email" id="delete-confirm-email" style="width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px;">
      <input type="password" id="delete-confirm-password" style="width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px;">

      <p id="delete-modal-error" style="color: red; font-size: 13px;"></p>

      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button onclick="confirmDeleteAccountWithPassword()" id="delete-modal-confirm-btn" style="flex: 1; height: 42px; border-radius: 8px; background-color: #d9534f; color: white; font-weight: bold; border: none; cursor: pointer;"></button>
        <button onclick="closeDeleteAccountModal()" id="delete-modal-cancel-btn" style="flex: 1; height: 42px; border-radius: 8px; cursor: pointer;"></button>
      </div>
    </div>
  </div>

  <div id="confirm-overlay" style="display:none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
    <div style="background-color: inherit; color: inherit; max-width: 320px; width: 90%; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid currentColor;">
      <h3 id="confirm-title" style="margin-top: 0;"></h3>
      <p id="confirm-message" style="font-size: 14px;"></p>
      <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button onclick="confirmYes()" id="confirm-delete-btn" style="flex: 1; height: 40px; border-radius: 8px; background-color: #d9534f; color: white; font-weight: bold; border: none; cursor: pointer;"></button>
        <button onclick="confirmNo()" id="confirm-cancel-btn" style="flex: 1; height: 40px; border-radius: 8px; font-weight: bold; cursor: pointer;"></button>
      </div>
    </div>
  </div>

  <div id="corner-clock" style="position: fixed; bottom: 20px; right: 20px; width: 200px; height: 60px; background-color: black; color: red; font-family: 'Courier New', monospace; font-size: 20px; font-weight: bold; display: flex; justify-content: center; align-items: center; border-radius: 10px; letter-spacing: 2px;"></div>

    function readableTextColor(hex) {
      const clean = (hex || "#cd6f01").replace("#", "");
      const full = clean.length === 3 ? clean.split("").map(c => c + c).join("") : clean;
      const r = parseInt(full.substring(0, 2), 16);
      const g = parseInt(full.substring(2, 4), 16);
      const b = parseInt(full.substring(4, 6), 16);
      const brightness = (r * 299 + g * 587 + b * 114) / 1000;
      return brightness > 150 ? "#000000" : "#ffffff";
    }

    function lightenColor(hex, percent) {
      const num = parseInt(hex.replace("#",""), 16);
      let r = (num >> 16) + Math.round(255 * percent);
      let g = ((num >> 8) & 0x00FF) + Math.round(255 * percent);
      let b = (num & 0x0000FF) + Math.round(255 * percent);
      r = Math.min(255, r); g = Math.min(255, g); b = Math.min(255, b);
      return "#" + (0x1000000 + r*0x10000 + g*0x100 + b).toString(16).slice(1);
    }

    function checkTaskReminders() {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;

      const now = new Date();
      const todayKey = dateKeyFromDate(now);
      const tasksToday = getTasksForDate(todayKey);

      // Forget reminder records from previous days so the list doesn't grow forever
      notifiedTaskIds = new Set([...notifiedTaskIds].filter(k => k.includes(todayKey)));

      tasksToday.forEach(task => {
        if (!task.start_time || task.completed) return;

        const [h, m] = task.start_time.split(':').map(Number);
        const taskTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m);
        const minutesUntil = (taskTime - now) / 60000;

        const fifteenMinKey = task.id + "-" + todayKey + "-15min";
        const startKey = task.id + "-" + todayKey + "-start";

        // Reminder #1: about 15 minutes before the task starts
        if (!notifiedTaskIds.has(fifteenMinKey) && minutesUntil <= 15 && minutesUntil >= 13) {
          new Notification("Plannery: " + task.title, {
            body: (task.location ? "📍 " + task.location + " — " : "") + "Starts in 15 minutes (" + task.start_time + ")",
            icon: "plannery_logo.png"
          });
          notifiedTaskIds.add(fifteenMinKey);
          saveNotifiedIds();
        }

        // Reminder #2: right at the task's start time
        if (!notifiedTaskIds.has(startKey) && minutesUntil <= 0.5 && minutesUntil >= -1) {
          new Notification("Plannery: " + task.title + " is starting now", {
            body: (task.location ? "📍 " + task.location : "Starting now"),
            icon: "plannery_logo.png"
          });
          notifiedTaskIds.add(startKey);
          saveNotifiedIds();
        }
      });
    }

    // ---- Import from Apple/Google Calendar (.ics files) ----
    function parseIcsDate(value) {
      // Formats: 20260719T140000Z or 20260719T140000 or 20260719
      const clean = value.replace('Z', '');
      const year = clean.substring(0, 4);
      const month = clean.substring(4, 6);
      const day = clean.substring(6, 8);
      let hour = "00", minute = "00";
      if (clean.length >= 15) {
        hour = clean.substring(9, 11);
        minute = clean.substring(11, 13);
      }
      return {
        date: year + "-" + month + "-" + day,
        time: (clean.length >= 15) ? (hour + ":" + minute) : null
      };
    }

    function parseIcsFile(text) {
      const events = [];
      const blocks = text.split("BEGIN:VEVENT").slice(1);
      blocks.forEach(block => {
        const end = block.split("END:VEVENT")[0];
        const lines = end.split(/\r?\n/);
        let summary = "", dtstart = "", dtend = "", location = "", description = "";
        lines.forEach(line => {
          if (line.startsWith("SUMMARY:")) summary = line.replace("SUMMARY:", "").trim();
          if (line.startsWith("DTSTART")) dtstart = line.split(":")[1] ? line.split(":")[1].trim() : "";
          if (line.startsWith("DTEND")) dtend = line.split(":")[1] ? line.split(":")[1].trim() : "";
          if (line.startsWith("LOCATION:")) location = line.replace("LOCATION:", "").trim();
          if (line.startsWith("DESCRIPTION:")) description = line.replace("DESCRIPTION:", "").trim();
        });
        if (summary && dtstart) {
          const start = parseIcsDate(dtstart);
          const endParsed = dtend ? parseIcsDate(dtend) : null;
          events.push({
            title: summary,
            date: start.date,
            start_time: start.time,
            end_time: endParsed ? endParsed.time : null,
            location: location || null,
            description: description || null
          });
        }
      });
      return events;
    }

    async function handleIcsUpload(event) {
      const file = event.target.files[0];

      if (!file) return;

      statusEl.style.color = "black";

      const text = await file.text();

      if (events.length === 0) {
        statusEl.style.color = "red";
        statusEl.textContent = "No events found in that file.";
        return;
      }

      statusEl.textContent = "Importing " + events.length + " event(s)...";

      const rows = events.map(ev => ({
        user_id: currentUser.id,
        date: ev.date,
        title: ev.title,

        location: ev.location,

        photo_url: null,
        color: "#cd6f01",
        repeat_type: "none",
        repeat_interval: null,
        repeat_custom_unit: null,
        completed: false

      if (error) {

        return;

      event.target.value = "";
    }

    // ---- Holidays ----
    // Names are in English. Dates are worked out by rules (no internet needed).
    const HOLIDAY_COUNTRIES = ['US','CA','GB','PL','FR','DE','ES','IT','PT','MX','IN','AU','BR'];

    // Rule types: ['f',month,day,name] fixed date | ['n',month,weekday,nth,name] nth weekday
    // ['l',month,weekday,name] last weekday | ['mb',month,day,name] Monday on/before a date
    // ['e',daysFromEaster,name] relative to Easter Sunday. Months are 1-12, weekday 0=Sun.
    const HOLIDAY_RULES = {

    let holidayCountries = [];
    const holidayYearCache = {};

    function easterSunday(year) {
      const a = year % 19, b = Math.floor(year / 100), c = year % 100;
      const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
      const g = Math.floor((b - f + 1) / 3);
      const h = (19 * a + b - d - g + 15) % 30;
      const i = Math.floor(c / 4), k = c % 4;
      const l = (32 + 2 * e + 2 * i - h - k) % 7;
      const m = Math.floor((a + 11 * h + 22 * l) / 451);
      const month = Math.floor((h + l - 7 * m + 114) / 31);
      const day = ((h + l - 7 * m + 114) % 31) + 1;
      return new Date(year, month - 1, day);
    }

    function nthWeekdayOfMonth(year, month, weekday, nth) {
      const first = new Date(year, month - 1, 1).getDay();
      return 1 + ((weekday - first + 7) % 7) + (nth - 1) * 7;
    }

    function lastWeekdayOfMonth(year, month, weekday) {
      const last = new Date(year, month, 0);
      return last.getDate() - ((last.getDay() - weekday + 7) % 7);
    }

    function buildHolidaysForYear(country, year) {
      const cacheKey = country + '-' + year;
      if (holidayYearCache[cacheKey]) return holidayYearCache[cacheKey];
      const map = {};
      const add = (m, d, name) => {
        const key = dateKey(year, m - 1, d);
        if (!map[key]) map[key] = [];
        map[key].push(name);
      };
      const easter = easterSunday(year);
      (HOLIDAY_RULES[country] || []).concat(HOLIDAY_EXTRA[country] || []).forEach(r => {
        if (r[0] === 'f') add(r[1], r[2], r[3]);
        else if (r[0] === 'n') {
          const dt = new Date(year, r[1] - 1, nthWeekdayOfMonth(year, r[1], r[2], r[3]) + (r[5] || 0));
          add(dt.getMonth() + 1, dt.getDate(), r[4]);
        } else if (r[0] === 'adv') {
          const xmas = new Date(year, 11, 25);
          const fourth = 25 - (xmas.getDay() === 0 ? 7 : xmas.getDay());
          const dt = new Date(year, 11, fourth - (4 - r[1]) * 7);
          add(dt.getMonth() + 1, dt.getDate(), r[2]);
        } else if (r[0] === 'fm') {
          let dt = new Date(year, 4, lastWeekdayOfMonth(year, 5, 0));
          const pent = new Date(easter.getFullYear(), easter.getMonth(), easter.getDate() + 49);
          if (dt.getTime() === pent.getTime()) dt = new Date(year, 5, 1 + ((7 - new Date(year, 5, 1).getDay()) % 7));
          add(dt.getMonth() + 1, dt.getDate(), r[1]);
        }
        else if (r[0] === 'l') add(r[1], lastWeekdayOfMonth(year, r[1], r[2]), r[3]);
        else if (r[0] === 'mb') {
          const dt = new Date(year, r[1] - 1, r[2]);
          dt.setDate(dt.getDate() - ((dt.getDay() - 1 + 7) % 7));
          add(dt.getMonth() + 1, dt.getDate(), r[3]);
        } else if (r[0] === 'e') {
          const dt = new Date(easter.getFullYear(), easter.getMonth(), easter.getDate() + r[1]);
          add(dt.getMonth() + 1, dt.getDate(), r[2]);
        }
      });
      holidayYearCache[cacheKey] = map;
      return map;
    }

    function getHolidaysForDate(key) {
      if (!holidayCountries.length) return [];
      const year = parseInt(key.slice(0, 4), 10);
      const byName = {};
      const order = [];
      holidayCountries.forEach(code => {
        (buildHolidaysForYear(code, year)[key] || []).forEach(name => {
          if (!byName[name]) { byName[name] = []; order.push(name); }
          byName[name].push(code);
        });
      });
      // With several countries on, tag holidays that aren't shared by all of them
      return order.map(name => {
        const codes = byName[name];
        if (holidayCountries.length > 1 && codes.length < holidayCountries.length) {
          return name + " (" + codes.join(", ") + ")";
        }
        return name;
      });
    }

    function holidayCountryLabel(code) {
      try {
        const names = new Intl.DisplayNames([currentLang], { type: 'region' });
        return names.of(code) || HOLIDAY_FALLBACK_NAMES[code];
      } catch (e) {
        return HOLIDAY_FALLBACK_NAMES[code];
      }
    }

    function buildHolidayOptions() {
      const box = document.getElementById('holiday-list');
      if (!box) return;
      box.innerHTML = '';
      HOLIDAY_COUNTRIES.forEach(code => {
        const row = document.createElement('label');
        row.style.display = 'flex';
        row.style.alignItems = 'center';
        row.style.gap = '8px';
        row.style.padding = '5px 0';
        row.style.fontSize = '14px';
        row.style.cursor = 'pointer';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.value = code;
        cb.checked = holidayCountries.includes(code);
        cb.style.width = 'auto';
        cb.style.margin = '0';
        cb.onchange = toggleHolidayCountry;
        const span = document.createElement('span');
        span.textContent = holidayCountryLabel(code);
        row.appendChild(cb);
        row.appendChild(span);
        box.appendChild(row);
      });
    }

    function toggleHolidayCountry() {
      const checked = [...document.querySelectorAll('#holiday-list input[type="checkbox"]:checked')].map(c => c.value);
      holidayCountries = HOLIDAY_COUNTRIES.filter(code => checked.includes(code));
      try { localStorage.setItem('plannery-holidays', JSON.stringify(holidayCountries)); } catch (e) {}
      renderCalendar();
      if (selectedDateStr) showHolidayBanner(selectedDateStr);
    }

    function loadSavedHolidays() {
      let saved = [];
      try {
        const raw = localStorage.getItem('plannery-holidays');
        if (raw) {
          const parsed = JSON.parse(raw);
          saved = Array.isArray(parsed) ? parsed : [parsed];
        }
      } catch (e) {
        // Older versions saved a single plain country code such as US
        try { const raw = localStorage.getItem('plannery-holidays'); if (raw) saved = [raw]; } catch (e2) {}
      }
      holidayCountries = HOLIDAY_COUNTRIES.filter(code => saved.includes(code));
    }

    function showHolidayBanner(key) {
      const el = document.getElementById('holiday-banner');
      if (!el) return;
      const names = getHolidaysForDate(key);
      if (!names.length) { el.style.display = 'none'; el.textContent = ''; return; }
      el.textContent = '🎉 ' + names.join(' · ');
      el.style.display = 'block';
      el.style.color = '#cd6f01';
      el.style.fontWeight = 'bold';
    }

    function dateKey(y, m, d) {
      return y + "-" + (m + 1).toString().padStart(2, "0") + "-" + d.toString().padStart(2, "0");
    }

    function dateKeyFromDate(dateObj) {
      return dateKey(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
    }

    async function loadTasks() {
      const { data, error } = await supabaseClient
        .from('tasks')
        .select('*')
        .eq('user_id', currentUser.id);

      if (error) {
        console.error("Error loading tasks:", error.message);
      }

      tasksByDate = {};
      allTasksFlat = data || [];
      if (data) {
        data.forEach(task => {
          if (!tasksByDate[task.date]) tasksByDate[task.date] = [];
          tasksByDate[task.date].push(task);
        });
      }
      renderCalendar();
      renderAgenda();
      checkTaskReminders();
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const monthNames = monthNamesByLang[currentLang] || monthNamesByLang.en;
      document.getElementById('month-label').textContent = monthNames[month] + " " + year;

      const calendarDiv = document.getElementById('calendar');
      calendarDiv.innerHTML = "";

      const dayNames = dayNamesByLang[currentLang] || dayNamesByLang.en;
      dayNames.forEach(d => {
        const el = document.createElement('div');
        el.className = "day-name";
        el.textContent = d;
        el.style.fontWeight = "bold";
        el.style.textAlign = "center";
        el.style.padding = "8px";
        calendarDiv.appendChild(el);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        calendarDiv.appendChild(document.createElement('div'));
      }

      const today = new Date();

      for (let d = 1; d <= daysInMonth; d++) {
        const dayOfWeek = (firstDay + d - 1) % 7;
        const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);

        const cellColors = {
          light:  { weekday: "#f7f7f7", weekend: "#eae6df", text: "#000000" },
          dark:   { weekday: "#2b2b2b", weekend: "#1a1a1a", text: "#ffffff" },
          blue:   { weekday: "#1f2733", weekend: "#141b24", text: "#4da6ff" },
          orange: { weekday: "#2b2118", weekend: "#1c150f", text: "#cd6f01" }
        }[currentTheme] || { weekday: "#f7f7f7", weekend: "#eae6df", text: "#000000" };

        const todayBgByTheme = { light: "#fff8f0", dark: "#3a2a10", blue: "#1f2733", orange: "#3a2a10" };
        const selectedBgByTheme = { light: "#eaf4ff", dark: "#12324d", blue: "#12324d", orange: "#12324d" };

        const key = dateKey(year, month, d);
        const dayCell = document.createElement('div');
        dayCell.className = "day-cell";
        dayCell.style.border = "1px solid #ccc";
        dayCell.style.borderRadius = "8px";
        dayCell.style.minHeight = "80px";
        dayCell.style.padding = "6px";
        dayCell.style.cursor = "pointer";
        dayCell.style.boxSizing = "border-box";
        dayCell.style.color = cellColors.text;
        dayCell.style.backgroundColor = isWeekend ? cellColors.weekend : cellColors.weekday;
        dayCell.onclick = () => openTaskPanel(key);

        if (d === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
          dayCell.style.border = "3px solid #cd6f01";
          dayCell.style.backgroundColor = todayBgByTheme[currentTheme] || todayBgByTheme.light;
        }

        if (selectedDateStr === key) {
          dayCell.style.border = "3px solid #4da6ff";
          dayCell.style.backgroundColor = selectedBgByTheme[currentTheme] || selectedBgByTheme.light;
        }

        const dayNum = document.createElement('div');
        dayNum.className = "day-num";
        dayNum.textContent = d;
        dayNum.style.fontWeight = "bold";
        dayCell.appendChild(dayNum);

        getHolidaysForDate(key).forEach(name => {
          const h = document.createElement('div');
          h.className = "holiday-tag";
          h.textContent = "🎉 " + name;
          h.style.fontSize = "11px";
          h.style.color = "#cd6f01";
          h.style.fontWeight = "bold";
          h.style.marginTop = "2px";
          h.style.overflow = "hidden";
          h.style.textOverflow = "ellipsis";
          h.style.whiteSpace = "nowrap";
          h.title = name;
          dayCell.appendChild(h);
        });

        const cellTasks = getTasksForDate(key);
        cellTasks.forEach(task => {
          const taskEl = document.createElement('div');
          taskEl.className = "task-tag";
          taskEl.textContent = task.title + (task.repeat_type && task.repeat_type !== 'none' ? " 🔁" : "");
          taskEl.style.fontSize = "12px";
          taskEl.style.backgroundColor = task.color || "#cd6f01";
          taskEl.style.color = readableTextColor(task.color || "#cd6f01");
          taskEl.style.borderRadius = "4px";
          taskEl.style.padding = "2px 4px";
          taskEl.style.marginTop = "3px";
          taskEl.style.overflow = "hidden";
          taskEl.style.textOverflow = "ellipsis";
          taskEl.style.whiteSpace = "nowrap";
          dayCell.appendChild(taskEl);
        });

        calendarDiv.appendChild(dayCell);
      }
    }

    function changeMonth(offset) {
      currentDate.setMonth(currentDate.getMonth() + offset);
      renderCalendar();
    }

    function renderAgenda() {
      const key = dateKeyFromDate(agendaDate);
      const today = new Date();
      const isToday = dateKeyFromDate(today) === key;

      const label = agendaDate.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
      document.getElementById('agenda-date-label').textContent = label;
      document.getElementById('agenda-today-tag').textContent = isToday ? t('today') : "";

      const listDiv = document.getElementById('agenda-list');
      listDiv.innerHTML = "";
      const tasks = getTasksForDate(key);

      if (tasks.length === 0) {
        const empty = document.createElement('div');
        empty.textContent = t('nothingPlanned');
        empty.style.fontSize = "13px";
        empty.style.color = "#888";
        listDiv.appendChild(empty);
        return;
      }

      tasks.forEach(task => {
        const item = document.createElement('div');
        item.style.borderLeft = "4px solid " + (task.color || "#cd6f01");
        item.style.padding = "6px 8px";
        item.style.marginBottom = "6px";
        item.style.fontSize = "13px";
        item.style.cursor = "pointer";
        item.onclick = () => openTaskPanel(key);

        const titleEl = document.createElement('div');
        titleEl.textContent = task.title;
        titleEl.style.fontWeight = "bold";
        if (task.completed) titleEl.style.textDecoration = "line-through";
        item.appendChild(titleEl);

        if (task.start_time || task.end_time) {
          const timeEl = document.createElement('div');
          timeEl.style.fontSize = "11px";
          timeEl.style.color = "#666";
          timeEl.textContent = (task.start_time ? formatTimeDisplay(task.start_time) : "?") + " - " + (task.end_time ? formatTimeDisplay(task.end_time) : "?");
          item.appendChild(timeEl);
        }

        listDiv.appendChild(item);
      });
    }

    function agendaShift(offsetDays) {
      agendaDate.setDate(agendaDate.getDate() + offsetDays);
      renderAgenda();
    }

    function agendaResetToday() {
      agendaDate = new Date();
      renderAgenda();
    }

    function autoGrowTextarea(el) {
      el.style.height = "auto";
      el.style.height = el.scrollHeight + "px";
    }

    function clearForm() {
      document.getElementById('new-task-title').value = "";
      document.getElementById('new-task-start').value = "";
      document.getElementById('new-task-end').value = "";
      document.getElementById('new-task-location').value = "";
      document.getElementById('new-task-description').value = "";
      document.getElementById('new-task-note').value = "";
      document.getElementById('new-task-description').style.height = "auto";
      document.getElementById('new-task-note').style.height = "auto";
      document.getElementById('new-task-photo').value = "";
      document.getElementById('new-task-color').value = "#cd6f01";
      document.getElementById('new-task-repeat').value = "none";
      document.getElementById('new-task-repeat-interval').value = "1";
      document.getElementById('new-task-repeat-unit').value = "days";
      document.getElementById('custom-repeat-fields').style.display = "none";
      document.getElementById('task-error-message').textContent = "";
      editingTaskId = null;
      document.getElementById('form-heading').textContent = t('addTask');
      document.getElementById('save-task-btn').textContent = t('addTask');
      document.getElementById('cancel-edit-btn').style.display = "none";
    }

    function toggleCustomRepeatFields() {
      const value = document.getElementById('new-task-repeat').value;
      document.getElementById('custom-repeat-fields').style.display = (value === 'custom') ? "block" : "none";
    }

    function taskOccursOnDate(task, dateStr) {
      if (!task.repeat_type || task.repeat_type === 'none') {
        return task.date === dateStr;
      }

      const origDate = new Date(task.date + 'T00:00:00');
      const checkDate = new Date(dateStr + 'T00:00:00');
      if (checkDate < origDate) return false;

      const diffDays = Math.round((checkDate - origDate) / 86400000);

      if (task.repeat_type === 'daily') {
        return diffDays >= 0;
      }
      if (task.repeat_type === 'weekly') {
        return diffDays % 7 === 0;
      }
      if (task.repeat_type === 'monthly') {
        return checkDate.getDate() === origDate.getDate();
      }
      if (task.repeat_type === 'yearly') {
        return checkDate.getDate() === origDate.getDate() && checkDate.getMonth() === origDate.getMonth();
      }
      if (task.repeat_type === 'custom') {
        const interval = task.repeat_interval || 1;
        const unit = task.repeat_custom_unit;
        if (unit === 'days') return diffDays % interval === 0;
        if (unit === 'weeks') return diffDays % (7 * interval) === 0;
        if (unit === 'months') {
          const monthDiff = (checkDate.getFullYear() - origDate.getFullYear()) * 12 + (checkDate.getMonth() - origDate.getMonth());
          return checkDate.getDate() === origDate.getDate() && monthDiff >= 0 && monthDiff % interval === 0;
        }
        if (unit === 'years') {
          const yearDiff = checkDate.getFullYear() - origDate.getFullYear();
          return checkDate.getDate() === origDate.getDate() && checkDate.getMonth() === origDate.getMonth() && yearDiff >= 0 && yearDiff % interval === 0;
        }
      }
      return false;
    }

    function getTasksForDate(dateStr) {
      return allTasksFlat.filter(task => taskOccursOnDate(task, dateStr));
    }

    function openTaskPanel(key) {
      selectedDateStr = key;
      const overlay = document.getElementById('task-panel-overlay');
      const panel = document.getElementById('task-panel');
      overlay.style.display = "flex";
      document.getElementById('task-date-label').textContent = key;
      showHolidayBanner(key);
      clearForm();
      renderTaskList();
      renderCalendar();

      requestAnimationFrame(() => {
        panel.style.opacity = "1";
        panel.style.transform = "scale(1)";
      });
    }

    function closeTaskPanel() {
      const overlay = document.getElementById('task-panel-overlay');
      const panel = document.getElementById('task-panel');
      panel.style.opacity = "0";
      panel.style.transform = "scale(0.9)";
      setTimeout(() => {
        overlay.style.display = "none";
      }, 250);
      selectedDateStr = null;
      renderCalendar();
    }

    function closeTaskPanelOverlay(e) {
      if (e.target.id === 'task-panel-overlay') closeTaskPanel();
    }

    function startEditTask(task) {
      editingTaskId = task.id;
      document.getElementById('new-task-title').value = task.title || "";
      document.getElementById('new-task-start').value = task.start_time || "";
      document.getElementById('new-task-end').value = task.end_time || "";
      document.getElementById('new-task-location').value = task.location || "";
      document.getElementById('new-task-description').value = task.description || "";
      document.getElementById('new-task-note').value = task.note || "";
      setTimeout(() => {
        autoGrowTextarea(document.getElementById('new-task-description'));
        autoGrowTextarea(document.getElementById('new-task-note'));
      }, 0);
      document.getElementById('new-task-color').value = task.color || "#cd6f01";
      document.getElementById('new-task-repeat').value = task.repeat_type || "none";
      document.getElementById('new-task-repeat-interval').value = task.repeat_interval || 1;
      document.getElementById('new-task-repeat-unit').value = task.repeat_custom_unit || "days";
      toggleCustomRepeatFields();
      document.getElementById('form-heading').textContent = t('editTask');
      document.getElementById('save-task-btn').textContent = t('saveChanges');
      document.getElementById('cancel-edit-btn').style.display = "block";
      document.getElementById('task-error-message').textContent = "";
      window.scrollTo({ top: document.getElementById('task-panel').offsetTop, behavior: 'smooth' });
    }

    function cancelEdit() {
      clearForm();
    }

    async function renderTaskList() {
      const listDiv = document.getElementById('task-list');
      listDiv.innerHTML = "";
      const tasks = getTasksForDate(selectedDateStr);
      for (const task of tasks) {
        const row = document.createElement('div');
        row.style.border = "1px solid #eee";
        row.style.borderLeft = "6px solid " + (task.color || "#cd6f01");
        row.style.borderRadius = "8px";
        row.style.padding = "8px";
        row.style.marginBottom = "8px";
        const titleRow = document.createElement('div');
        titleRow.style.display = "flex";
        titleRow.style.justifyContent = "space-between";
        titleRow.style.alignItems = "center";

        const label = document.createElement('span');
        label.textContent = task.title;
        label.style.fontWeight = "bold";
        if (task.completed) label.style.textDecoration = "line-through";

        const btnGroup = document.createElement('div');

        const editBtn = document.createElement('button');
        editBtn.textContent = t('edit');
        editBtn.style.marginRight = "5px";
        editBtn.onclick = () => startEditTask(task);

        const doneBtn = document.createElement('button');
        doneBtn.textContent = task.completed ? t('undo') : t('done');
        doneBtn.style.marginRight = "5px";
        doneBtn.onclick = () => toggleTask(task);

        const delBtn = document.createElement('button');
        delBtn.textContent = t('deleteBtn');
        delBtn.onclick = () => askDeleteConfirm(task);

        btnGroup.appendChild(editBtn);
        btnGroup.appendChild(doneBtn);
        btnGroup.appendChild(delBtn);
        titleRow.appendChild(label);
        titleRow.appendChild(btnGroup);
        row.appendChild(titleRow);

        if (task.start_time || task.end_time) {
          const timeEl = document.createElement('div');
          timeEl.style.fontSize = "12px";
          timeEl.style.color = "#555";
          timeEl.textContent = (task.start_time ? formatTimeDisplay(task.start_time) : "?") + " - " + (task.end_time ? formatTimeDisplay(task.end_time) : "?");
          row.appendChild(timeEl);
        }

        if (task.location) {
          const locEl = document.createElement('div');
          locEl.style.fontSize = "12px";
          locEl.style.color = "#555";
          locEl.textContent = "📍 " + task.location;
          row.appendChild(locEl);
        }

        if (task.description) {
          const descEl = document.createElement('div');
          descEl.style.fontSize = "13px";
          descEl.style.marginTop = "4px";
          descEl.style.whiteSpace = "pre-wrap";
          descEl.textContent = task.description;
          row.appendChild(descEl);
        }

        if (task.note) {
          const noteEl = document.createElement('div');
          noteEl.style.fontSize = "12px";
          noteEl.style.marginTop = "4px";
          noteEl.style.fontStyle = "italic";
          noteEl.style.color = "#777";
          noteEl.style.whiteSpace = "pre-wrap";
          noteEl.textContent = "Note: " + task.note;
          row.appendChild(noteEl);
        }

        if (task.photo_url) {
          const img = document.createElement('img');
          img.style.maxWidth = "100%";
          img.style.marginTop = "6px";
          img.style.borderRadius = "6px";
          const { data: signedData } = await supabaseClient
            .storage
            .from('task-photos')
            .createSignedUrl(task.photo_url, 3600);
          if (signedData && signedData.signedUrl) {
            img.src = signedData.signedUrl;
          }
          row.appendChild(img);
        }

        listDiv.appendChild(row);
      }
      styleControlsForTheme(currentTheme);
    }

    async function saveTask() {
      const errorMsg = document.getElementById('task-error-message');
      const title = document.getElementById('new-task-title').value.trim();
      const startTime = document.getElementById('new-task-start').value;
      const endTime = document.getElementById('new-task-end').value;
      const location = document.getElementById('new-task-location').value.trim();
      const description = document.getElementById('new-task-description').value.trim();
      const note = document.getElementById('new-task-note').value.trim();
      const photoFile = document.getElementById('new-task-photo').files[0];
      const color = document.getElementById('new-task-color').value;
      const repeatType = document.getElementById('new-task-repeat').value;
      const repeatInterval = (repeatType === 'custom') ? parseInt(document.getElementById('new-task-repeat-interval').value, 10) || 1 : null;
      const repeatUnit = (repeatType === 'custom') ? document.getElementById('new-task-repeat-unit').value : null;

      errorMsg.textContent = "";

      if (!title || !selectedDateStr) {
        errorMsg.textContent = t('pleaseEnterTitle');
        return;
      }

      let photoUrl = editingTaskId ? undefined : null;

      if (photoFile) {
        const filePath = currentUser.id + "/" + Date.now() + "_" + photoFile.name;
        const { error: uploadError } = await supabaseClient
          .storage
          .from('task-photos')
          .upload(filePath, photoFile);

        if (uploadError) {
          errorMsg.textContent = "Photo upload failed: " + uploadError.message;
          return;
        }

        photoUrl = filePath;
      }

      if (editingTaskId) {
        const updateFields = {
          title: title,
          start_time: startTime || null,
          end_time: endTime || null,
          location: location || null,
          description: description || null,
          note: note || null,
          color: color,
          repeat_type: repeatType,
          repeat_interval: repeatInterval,
          repeat_custom_unit: repeatUnit
        };
        if (photoUrl !== undefined) updateFields.photo_url = photoUrl;

        const { data, error } = await supabaseClient
          .from('tasks')
          .update(updateFields)
          .eq('id', editingTaskId)
          .select();

        if (error) {
          errorMsg.textContent = "Could not save: " + error.message;
          return;
        }

        if (data && data[0]) {
          const list = tasksByDate[data[0].date] || [];
          const idx = list.findIndex(t2 => t2.id === editingTaskId);
          if (idx !== -1) list[idx] = data[0];
          const flatIdx = allTasksFlat.findIndex(t2 => t2.id === editingTaskId);
          if (flatIdx !== -1) allTasksFlat[flatIdx] = data[0];
          clearForm();
          renderTaskList();
          renderCalendar();
          renderAgenda();
        }
      } else {
        const { data, error } = await supabaseClient
          .from('tasks')
          .insert([{
            user_id: currentUser.id,
            date: selectedDateStr,
            title: title,
            start_time: startTime || null,
            end_time: endTime || null,
            location: location || null,
            description: description || null,
            note: note || null,
            photo_url: photoUrl,
            color: color,
            repeat_type: repeatType,
            repeat_interval: repeatInterval,
            repeat_custom_unit: repeatUnit,
            completed: false
          }])
          .select();

        if (error) {
          errorMsg.textContent = "Could not save: " + error.message;
          console.error("Insert error:", error);
          return;
        }

        if (data) {
          if (!tasksByDate[selectedDateStr]) tasksByDate[selectedDateStr] = [];
          tasksByDate[selectedDateStr].push(data[0]);
          allTasksFlat.push(data[0]);
          clearForm();
          renderTaskList();
          renderCalendar();
          renderAgenda();
        }
      }
    }

    async function toggleTask(task) {
      const { error } = await supabaseClient
        .from('tasks')
        .update({ completed: !task.completed })
        .eq('id', task.id);
      if (!error) {
        const wasJustCompleted = !task.completed;
        task.completed = !task.completed;
        renderTaskList();
        renderAgenda();
        if (wasJustCompleted) {
          launchConfetti();
        }
      }
    }

    function launchConfetti() {
      const colors = ['#cd6f01', '#4da6ff', '#e74c3c', '#2ecc71', '#f1c40f', '#9b59b6'];
      const pieceCount = 80;

      for (let i = 0; i < pieceCount; i++) {
        const piece = document.createElement('div');
        const size = Math.random() * 8 + 6;
        piece.style.position = 'fixed';
        piece.style.top = '-20px';
        piece.style.left = Math.random() * 100 + 'vw';
        piece.style.width = size + 'px';
        piece.style.height = size + 'px';
        piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        piece.style.opacity = '0.9';
        piece.style.zIndex = '2000';
        piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        piece.style.pointerEvents = 'none';
        piece.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
        document.body.appendChild(piece);

        const duration = Math.random() * 1500 + 2000;
        const drift = (Math.random() - 0.5) * 200;

        piece.animate([
          { transform: piece.style.transform, top: '-20px', opacity: 0.9 },
          { transform: 'translateX(' + drift + 'px) rotate(' + (Math.random() * 720) + 'deg)', top: '100vh', opacity: 0.3 }
        ], {
          duration: duration,
          easing: 'ease-in'
        });

        setTimeout(() => piece.remove(), duration);
      }
    }

    let pendingDeleteTask = null;

    function askDeleteConfirm(task) {
      pendingDeleteTask = task;
      document.getElementById('confirm-message').textContent = t('deleteConfirmMsg').replace('{title}', task.title);
      document.getElementById('confirm-overlay').style.display = "flex";
    }

    function confirmNo() {
      pendingDeleteTask = null;
      document.getElementById('confirm-overlay').style.display = "none";
    }

    async function confirmYes() {
      const task = pendingDeleteTask;
      document.getElementById('confirm-overlay').style.display = "none";
      pendingDeleteTask = null;
      if (task) await deleteTask(task);
    }

    async function deleteTask(task) {
      const { error } = await supabaseClient
        .from('tasks')
        .delete()
        .eq('id', task.id);
      if (!error) {
        if (tasksByDate[task.date]) tasksByDate[task.date] = tasksByDate[task.date].filter(t2 => t2.id !== task.id);
        allTasksFlat = allTasksFlat.filter(t2 => t2.id !== task.id);
        renderTaskList();
        renderCalendar();
        renderAgenda();
        if (editingTaskId === task.id) clearForm();
      }
    }

    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = now.getMinutes().toString().padStart(2, '0');
      const seconds = now.getSeconds().toString().padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;
      hours = hours.toString().padStart(2, '0');
      document.getElementById('corner-clock').textContent = `${hours}:${minutes}:${seconds} ${ampm}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    loadSavedTheme();
    styleControlsForTheme(currentTheme);
    loadSavedTimeFormat();
    loadSavedHolidays();
    loadSavedLanguage();
    checkAuth();
  </script>
